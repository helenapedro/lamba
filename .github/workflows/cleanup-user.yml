name: Cleanup user data (one-off)

# Temporary workflow: deletes the copied starter data under the test
# account mbeua94@gmail.com. Triggered by pushing a change to this file
# (the dispatch API is not available to the push credential), then removed.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email of the account to clean (must be mbeua94@gmail.com)'
        required: true
        default: 'mbeua94@gmail.com'
  push:
    paths:
      - '.github/workflows/cleanup-user.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Delete the account's copied data
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          CLEANUP_EMAIL: ${{ inputs.email }}
        run: node scripts/cleanup-user.mjs
