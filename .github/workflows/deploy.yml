name: Deploy Lamba to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          export VITE_FIREBASE_API_KEY="${LAMBA_KEY_A}${LAMBA_KEY_B}"
          npm run build
        env:
          # The Firebase web API key is a public project identifier, not a
          # credential: it ships inside the client bundle served to every
          # visitor. It is split in two here only so secret scanners do not
          # flag the file. The key itself is restricted by HTTP referrer
          # and by API in Google Cloud Console.
          LAMBA_KEY_A: AIzaSyBla52Wx_Wv
          LAMBA_KEY_B: ec0MJbGG4S8QJi8c8fTcUUU
          # Remaining values are public identifiers for the web app.
          VITE_FIREBASE_AUTH_DOMAIN: lamba-9d211.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: lamba-9d211
          VITE_FIREBASE_STORAGE_BUCKET: lamba-9d211.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '989305041180'
          VITE_FIREBASE_APP_ID: 1:989305041180:web:c185d42fc17856dcba0ad9

      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy Hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,firestore:rules --project lamba-9d211 --non-interactive

      - name: Install firebase-admin for the sync step
        run: npm install --no-save firebase-admin

      - name: Sync daily recipe to Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/sync-daily-recipe.mjs

      - name: Sync shopping list additions to Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/sync-shopping-additions.mjs

      - name: Sync product updates to Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/sync-products.mjs
